<!doctype html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://script.google.com https://script.googleusercontent.com; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>ورود برگزارکنندگان — پیشران</title>
  <meta name="theme-color" content="#062319">
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="../fonts/Vazirmatn.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <main class="gate">
    <svg class="gate__trace" viewBox="0 0 600 600" aria-hidden="true" focusable="false">
      <g fill="none" stroke="currentColor" stroke-linejoin="round">
        <path d="M535.8 268.1 L584.0 275.7 L584.0 324.3 L535.8 331.9 L526.4 373.5 L566.4 401.3 L545.3 445.1 L498.6 431.1 L472.0 464.5 L496.0 506.9 L458.1 537.1 L422.1 504.3 L383.6 522.8 L386.9 571.4 L339.5 582.2 L321.3 537.0 L278.7 537.0 L260.5 582.2 L213.1 571.4 L216.4 522.8 L177.9 504.3 L141.9 537.1 L104.0 506.9 L128.0 464.5 L101.4 431.1 L54.7 445.1 L33.6 401.3 L73.6 373.5 L64.2 331.9 L16.0 324.3 L16.0 275.7 L64.2 268.1 L73.6 226.5 L33.6 198.7 L54.7 154.9 L101.4 168.9 L128.0 135.5 L104.0 93.1 L141.9 62.9 L177.9 95.7 L216.4 77.2 L213.1 28.6 L260.5 17.8 L278.7 63.0 L321.3 63.0 L339.5 17.8 L386.9 28.6 L383.6 77.2 L422.1 95.7 L458.1 62.9 L496.0 93.1 L472.0 135.5 L498.6 168.9 L545.3 154.9 L566.4 198.7 L526.4 226.5Z" stroke-width="2"/>
        <circle cx="300" cy="300" r="196" stroke-width="1.2" opacity=".6"/>
        <circle cx="300" cy="300" r="120" stroke-width="1.2" opacity=".5"/>
        <circle cx="300" cy="300" r="36" stroke-width="2"/>
      </g>
    </svg>
    <section class="gate__card" aria-labelledby="t">
      <div class="gate__logos"><span class="gate__badge"><img src="../assets/logo-pishran.png" alt="پیشران" width="64" height="64"></span><span class="gate__x" aria-hidden="true">×</span><img class="gate__panter" src="../assets/logo-panter.svg" alt="پنتر" width="120" height="33"></div>
      <h1 id="t">ورود برگزارکنندگان</h1>
      <p class="gate__sub">این بخش فقط برای ستاد برگزاری اردو است.</p>
      <form id="f" novalidate>
        <div class="fld">
          <label for="u">نام‌کاربری</label>
          <input id="u" name="username" type="text" dir="ltr" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
        </div>
        <div class="fld">
          <label for="p">رمز عبور</label>
          <input id="p" name="password" type="password" dir="ltr" autocomplete="current-password" required>
        </div>
        <p class="msg" id="m" role="alert" hidden></p>
        <button class="go" id="b" type="submit">ورود به پنل</button>
      </form>
      <a class="back" href="../">بازگشت به صفحه ثبت‌نام</a>
    </section>
  </main>
  <script src="../js/config.js"></script>
  <script src="../js/gas-adapter.js"></script>
  <script src="login.js"></script>
</body>
</html>
